<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="/images/drugza-logo.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Drugza — Your Trusted Pharmacy Marketplace</title>
    <meta name="description" content="Order medicines, medical supplies, and cold-chain products online from verified Egyptian distributors at competitive wholesale prices.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="author" content="Drugza">
    <meta name="theme-color" content="#12496B">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <!-- Open Graph -->
    <meta property="og:site_name" content="Drugza">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Drugza — Your Trusted Pharmacy Marketplace">
    <meta property="og:description" content="Order medicines, medical supplies, and cold-chain products online from verified Egyptian distributors at competitive wholesale prices.">
    <meta property="og:image" content="/images/drugza-logo.jpg">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="ar_EG">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Drugza — Your Trusted Pharmacy Marketplace">
    <meta name="twitter:description" content="Order medicines, medical supplies, and cold-chain products online from verified Egyptian distributors at competitive wholesale prices.">
    <meta name="twitter:image" content="/images/drugza-logo.jpg">
    <!-- Google Fonts: Cairo for Arabic, Manrope for display and Inter for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://drugzaapi.runasp.net">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Structured data: brand/organization + site search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://drugza-frontend-store.vercel.app/#organization",
          "name": "Drugza",
          "alternateName": "دراجزا",
          "url": "https://drugza-frontend-store.vercel.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://drugza-frontend-store.vercel.app/images/drugza-logo.jpg"
          },
          "description": "Drugza is an Egyptian B2B pharmacy marketplace connecting pharmacies with EDA-licensed distributors, live wholesale prices, and cold-chain delivery.",
          "areaServed": {
            "@type": "Country",
            "name": "Egypt"
          },
          "sameAs": [
            "https://play.google.com/store/apps/details?id=com.app.drugza",
            "https://www.facebook.com/DrugZA",
            "https://www.tiktok.com/@drugza.eg"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://drugza-frontend-store.vercel.app/#website",
          "url": "https://drugza-frontend-store.vercel.app/",
          "name": "Drugza",
          "alternateName": "دراجزا",
          "inLanguage": ["en", "ar"],
          "publisher": { "@id": "https://drugza-frontend-store.vercel.app/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://drugza-frontend-store.vercel.app/catalog?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
